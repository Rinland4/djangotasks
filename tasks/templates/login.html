<!DOCTYPE html>
<html>
<body>
<h1>Log in</h1>
{% if form.errors %}
<p>Your username or password was not correct. Try again.</p>
{% endif %}
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<input type="hidden" name="next" value="{{ next }}">
<button type="submit">Log in</button>
</form>
</body>
</html>
