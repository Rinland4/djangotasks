<!DOCTYPE html>
<html>
<body>
    
<h1>My tasks</h1>
<p><a href="{% url 'task-create' %}">Add a task</a></p>
{% for task in tasks %}
    <article>
        <h2>{{ task.title }}</h2>
        <p>{{ task.description }}</p>
        <p>Due: {{ task.due_date }} | Priority: {{ task.priority }}</p>
        <p>Status: {% if task.completed %}Complete{% else %}Not complete{% endif %}</p>
        <a href="{% url 'task-update' task.pk %}">Edit</a>
        <a href="{% url 'task-delete' task.pk %}">Delete</a>
    </article>
{% empty %}
    <p>No tasks yet. Add your first task.</p>
{% endfor %}
</html>
</body>
